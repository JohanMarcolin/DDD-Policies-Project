name: ddd_policies_project
publish_to: "none"
description: >-
  A full-stack Dart project developed for the purpose of exploring how DDD policies can be implemented in practice.
  Includes a Flutter client, a Dart Shelf-based server, centralized business logic, and reusable utilities.
version: 1.0.0

environment:
  sdk: '>3.5.0 <4.0.0'
workspace:
  - apps/client
  - apps/server
  - packages/domain
  - packages/env_config
  - packages/api_error_codes
  - packages/http_api
  - packages/test_utils
  - packages/mappers

dev_dependencies:
  melos: ^7.3.0
  lints: ^6.0.0

dependency_overrides:
  analyzer: ^8.0.0

melos:
  scripts:
    # Building
    bootstrap: melos bootstrap
    env_build: melos exec --scope=env_config "dart run build_runner build --delete-conflicting-outputs"
    # Code Quality
    lint: melos exec --concurrency=4 "dart analyze"
    format: melos exec --concurrency=16 "dart format . --line-length 120"
    # Testing
    domain_unit_test: melos exec --scope=domain "dart test"
    client_bloc_test: melos exec --scope=client --fail-fast "flutter test test/bloc"
    client_e2e_integration_test: melos exec --scope=client --fail-fast "flutter test integration_test/e2e"
    client_presentation_integration_test: melos exec --scope=client --fail-fast "flutter test integration_test/presentation"
    server_api_test: melos exec --scope=server --fail-fast "dart test"